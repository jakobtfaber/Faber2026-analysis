# Manuscript figure regeneration catalog.
# Source of truth for `analysis/scripts/figure_flow.py` / `make figures`.
# Cross-check: analysis/repro_manifest.csv and analysis/figure_review/slots.json.
schema_version: 1

figures:
  - id: dm_host_posteriors
    tex: fig:dm_host_posteriors
    manuscript: true
    clone_ok: true
    repro_output: figures/dm_host_posteriors.pdf
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - analysis/scripts/dm_budget_uncertainty.py
      cwd: .
    inputs:
      - analysis/foregrounds/studies/census/budget_table_data.json
      - analysis/dispersion/results/joint-phase/manuscript_dm_catalog.csv
      - analysis/scripts/dm_budget_intervening_systems.csv
      - analysis/scripts/phineas_halo_crossing_inputs.csv
    outputs:
      - figures/dm_host_posteriors.pdf
    depends_on: []
    approval_slot: null

  - id: ne2025_mw
    tex: fig:ne2025_mw
    manuscript: true
    clone_ok: true
    repro_output: figures/ne2025_mw_characterization_nside32.pdf
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - analysis/scripts/plot_ne2025_mw_properties.py
        - --nside
        - "32"
      cwd: .
    inputs:
      - analysis/scripts/ne2025_allsky_cache_nside32.npz
    outputs:
      - figures/ne2025_mw_characterization_nside32.pdf
    depends_on: []
    approval_slot: null

  - id: sightline_halo_grid
    tex: fig:sightline_halo_grid
    manuscript: true
    clone_ok: false
    repro_output: figures/sightline_halo_grid.pdf
    notes: >-
      Corrected foreground geometry stages under analysis/figure_review only.
      Promote to figures/sightline_halo_grid.pdf only through the fig3-halo-grid
      review slot after independent validation and manuscript-owner visual
      approval.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - galaxies.v2_0.sightline_halo_grid
        - --halo-csv
        - foregrounds/studies/census/data/sightline_halo_grid.csv
        - --out-dir
        - figure_review/staging/fig3_halo_grid/figures
      cwd: analysis
    inputs:
      - analysis/foregrounds/studies/census/data/sightline_halo_grid.csv
    outputs:
      - analysis/figure_review/staging/fig3_halo_grid/figures/sightline_halo_grid.pdf
    manuscript_target: figures/sightline_halo_grid.pdf
    candidate_root: analysis/figure_review/staging/fig3_halo_grid
    depends_on: []
    approval_slot: fig3-halo-grid

  - id: sightline_budget
    tex: null
    manuscript: true
    clone_ok: true
    repro_output: figures/sightline_dm_scattering_budget.pdf
    notes: >-
      Intermediate node. systems_figures.py reads
      scattering/results/legacy-summary/sightline_dm_scattering_budget.csv written by this module.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - galaxies.foreground.sightline_budget
        - --results-dir
        - scattering/results/legacy-summary
        - --configs-dir
        - config/fits/scattering/bursts/chime
        - --census-data-dir
        - foregrounds/studies/census/data
      cwd: analysis
    inputs: []
    outputs:
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.csv
    depends_on: []
    approval_slot: null

  - id: clusters_icm
    tex: fig:clusters_icm
    manuscript: true
    clone_ok: true
    repro_output: figures/clusters_icm.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - galaxies.v2_0.systems_figures
        - --results-dir
        - scattering/results/legacy-summary
        - --census-data-dir
        - foregrounds/studies/census/data
        - --out-dir
        - ../figures
      cwd: analysis
    inputs:
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.csv
    outputs:
      - figures/clusters_icm.pdf
    depends_on:
      - sightline_budget
    approval_slot: null

  - id: assoc_cards_grid
    tex: fig:assoc-cards-grid
    manuscript: true
    clone_ok: true
    repro_output: figures/association_cards/association_card_*.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - associations/studies/crossmatching/plot_association_cards.py
        - --manuscript-dir
        - ../figures/association_cards
      cwd: analysis
    inputs: []
    outputs:
      - figures/association_cards/association_card_*.pdf
    depends_on: []
    approval_slot: null

  - id: toa_offset_decomposition
    tex: fig:toa-offset-decomposition
    manuscript: true
    clone_ok: true
    repro_output: figures/toa_offset_decomposition.pdf
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - analysis/scripts/plot_toa_offset_decomposition.py
      cwd: .
    inputs:
      - analysis/associations/studies/crossmatching/toa_crossmatch_results.json
    outputs:
      - figures/toa_offset_decomposition.pdf
    depends_on: []
    approval_slot: null

  - id: fig1_gallery
    tex: fig:codetection-data-grid
    manuscript: true
    clone_ok: false
    repro_output: figures/codetection_data_grid.pdf
    notes: >-
      Needs separate ~/Data/Faber2026/chimefrb/CHIME_bursts and
      ~/Data/Faber2026/dsa110/DSA_bursts waterfalls. Writes staging tree only;
      promote via figure_review (never silent overwrite of manuscript PDF).
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - analysis/scripts/plot_codetection_data_grid.py
        - --out
        - analysis/figure_review/staging/fig1_gallery/figures/codetection_data_grid
      cwd: .
    inputs:
      - analysis/dispersion/results/joint-phase/manuscript_dm_catalog.csv
      - analysis/scripts/jointmodel_triptych_manifest.yaml
      - ~/Data/Faber2026/chimefrb/CHIME_bursts
      - ~/Data/Faber2026/dsa110/DSA_bursts
    outputs:
      - analysis/figure_review/staging/fig1_gallery/figures/codetection_data_grid.pdf
    manuscript_target: figures/codetection_data_grid.pdf
    candidate_root: analysis/figure_review/staging/fig1_gallery
    depends_on: []
    approval_slot: fig1-gallery

  - id: oran_qualified_scint
    tex: null
    manuscript: false
    clone_ok: false
    repro_output: >-
      analysis/scintillation/studies/dsa-lorentzian/results/oran_qualified/figures/oran_dsa_calibrated_measurement.png
    notes: >-
      Pipeline qualification product only — not a dedicated manuscript figure.
      Certified DSA bandwidth evidence lives under oran_qualified/; do not
      treat as an embedded TeX panel.
    producer:
      argv:
        - uv
        - run
        - --frozen
        - python
        - scintillation/studies/dsa-lorentzian/validate_oran_dsa_measurement.py
        - --output-dir
        - scintillation/studies/dsa-lorentzian/results/oran_qualified
      cwd: analysis
    inputs: []
    outputs:
      - analysis/scintillation/studies/dsa-lorentzian/results/oran_qualified/figures/oran_dsa_calibrated_measurement.png
    depends_on: []
    approval_slot: oran-qualified-scintillation

  # --- manuscript: false (discoverable; do not regen into compiled manuscript) ---

  - id: association_summary
    tex: fig:association-summary
    manuscript: false
    clone_ok: true
    repro_output: figures/association_summary.pdf
    notes: Placeholder / pending owner figure_review slot fig5-association.
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - analysis/scripts/plot_association_summary.py
      cwd: .
    inputs:
      - analysis/dispersion/results/joint-phase/manuscript_dm_catalog.csv
    outputs:
      - figures/association_summary.pdf
    depends_on: []
    approval_slot: fig5-association

  - id: dsa_lorentzian_summary
    tex: fig:scint-qualified-summary
    manuscript: false
    clone_ok: false
    repro_output: figures/dsa_lorentzian_summary.pdf
    notes: Removed from compiled manuscript 2026-07-17; DSA-only summary rejected.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - scintillation/studies/dsa-lorentzian/run_dsa_lorentzian_fits.py
      cwd: analysis
    inputs: []
    outputs:
      - figures/dsa_lorentzian_summary.pdf
    depends_on: []
    approval_slot: fig6-scint-summary

  - id: jointmodel_pair_family
    tex: null
    manuscript: false
    clone_ok: false
    repro_output: figures/jointmodel_pair/*_jointmodel_pair.pdf
    notes: SUPPRESSED pre-PL-PBF; do not promote into manuscript.
    producer:
      argv:
        - conda
        - run
        - -n
        - flits
        - --no-capture-output
        - python
        - scattering/studies/joint-refits/plot_jointmodel_pair.py
        - --out-dir
        - ../figures/jointmodel_pair
      cwd: analysis
    inputs: []
    outputs:
      - figures/jointmodel_pair/*_jointmodel_pair.pdf
    depends_on: []
    approval_slot: null

  - id: dsa_acf_family
    tex: null
    manuscript: false
    clone_ok: false
    repro_output: figures/dsa_scint_acf/*_dsa_acf_lorentzian_fits.pdf
    notes: Removed from compilation 2026-07-17; superseded DSA-only panels.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - scintillation/studies/dsa-lorentzian/run_dsa_lorentzian_fits.py
      cwd: analysis
    inputs: []
    outputs:
      - figures/dsa_scint_acf/*_dsa_acf_lorentzian_fits.pdf
    depends_on: []
    approval_slot: null
