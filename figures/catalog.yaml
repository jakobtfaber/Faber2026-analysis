# Manuscript figure regeneration catalog.
# Source of truth for `analysis/scripts/figure_flow.py` / `make figures`.
# Cross-check: analysis/repro_manifest.csv and analysis/figure_review/definitions/slots.json.
schema_version: 1

figures:
  - id: energetics_all_events
    tex: fig:energetics
    manuscript: true
    clone_ok: true
    repro_output: figures/energetics_all_events.pdf
    notes: >-
      Current producer renders the tracked candidate fluence receipt into
      figure-review staging only. Promotion remains blocked until every plotted
      band is accepted for window, calibration, correlated noise, and review.
    producer:
      argv:
        - uv
        - run
        - --project
        - analysis
        - --frozen
        - python
        - analysis/energetics/studies/burst-energies/plot_all_event_energetics.py
        - --fluences
        - analysis/energetics/studies/burst-energies/data_fluences.candidate.csv
        - --output
        - analysis/figure_review/staging/energetics_all_events/figures/energetics_all_events.pdf
        - --candidate
      cwd: .
    inputs:
      - analysis/energetics/studies/burst-energies/data_fluences.candidate.csv
      - analysis/foregrounds/census/data/frozen_census/law2024_host_redshift_extract.csv
      - analysis/foregrounds/census/data/frozen_census/verdi2025_host_redshift_extract.csv
    outputs:
      - analysis/figure_review/staging/energetics_all_events/figures/energetics_all_events.pdf
      - analysis/figure_review/staging/energetics_all_events/figures/energetics_all_events.provenance.json
    manuscript_target: figures/energetics_all_events.pdf
    candidate_root: analysis/figure_review/staging/energetics_all_events
    depends_on: []
    approval_slot: fig-energetics-summary

  - id: dm_host_posteriors
    tex: fig:dm_host_posteriors
    manuscript: true
    clone_ok: true
    repro_output: figures/dm_host_posteriors.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - analysis
        - --frozen
        - python
        - analysis/scripts/dm_budget_uncertainty.py
      cwd: .
    inputs:
      - analysis/foregrounds/census/budget_table_data.json
      - analysis/dispersion/results/joint-phase/manuscript_dm_catalog.csv
      - analysis/scripts/dm_budget_intervening_systems.csv
      - analysis/scripts/phineas_halo_crossing_inputs.csv
    outputs:
      - figures/dm_host_posteriors.pdf
    depends_on: []
    approval_slot: null

  - id: ne2025_mw
    tex: fig:ne2025_mw
    manuscript: true
    clone_ok: true
    repro_output: figures/ne2025_mw_characterization_nside32.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - analysis
        - --frozen
        - python
        - analysis/scripts/plot_ne2025_mw_properties.py
        - --nside
        - "32"
      cwd: .
    inputs:
      - analysis/scripts/ne2025_allsky_cache_nside32.npz
    outputs:
      - figures/ne2025_mw_characterization_nside32.pdf
    depends_on: []
    approval_slot: null

  - id: sightline_halo_grid
    tex: fig:sightline_halo_grid
    manuscript: true
    clone_ok: false
    repro_output: figures/sightline_halo_grid.pdf
    notes: >-
      Corrected foreground geometry stages under analysis/figure_review only.
      Promote to figures/sightline_halo_grid.pdf only through the fig3-halo-grid
      review slot after independent validation and manuscript-owner visual
      approval.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - foregrounds.visualization.sightline_halo_grid
        - --halo-csv
        - foregrounds/census/data/sightline_halo_grid.csv
        - --out-dir
        - figure_review/artifacts/staging/fig3_halo_grid/figures
        - --review-candidate
      cwd: analysis
    inputs:
      - analysis/foregrounds/census/data/sightline_halo_grid.csv
      - analysis/foregrounds/census/data/sightline_halo_grid.receipt.json
      - analysis/foregrounds/census/data/hostless_sightlines/receipt.json
      - analysis/foregrounds/census/data/survey_coverage/all_12_sightlines.csv
      - analysis/foregrounds/results/dm_redshift/posterior.json
      - analysis/foregrounds/results/dm_redshift/receipt.json
    outputs:
      - analysis/figure_review/artifacts/staging/fig3_halo_grid/figures/sightline_halo_grid.pdf
      - analysis/figure_review/artifacts/staging/fig3_halo_grid/figures/sightline_halo_grid.svg
      - analysis/figure_review/artifacts/staging/fig3_halo_grid/figures/sightline_halo_grid.png
      - analysis/figure_review/artifacts/staging/fig3_halo_grid/provenance/figure3-candidate.json
    manuscript_target: figures/sightline_halo_grid.pdf
    candidate_root: analysis/figure_review/artifacts/staging/fig3_halo_grid
    depends_on: []
    approval_slot: fig3-halo-grid

  - id: sightline_budget
    tex: null
    manuscript: false
    clone_ok: true
    repro_output: analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.pdf
    notes: >-
      Intermediate node. systems_figures.py reads
      scattering/results/legacy-summary/sightline_dm_scattering_budget.csv written by this module.
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - foregrounds.propagation.sightline_budget
        - --results-dir
        - scattering/results/legacy-summary
        - --configs-dir
        - config/fits/scattering/bursts/chime
      cwd: analysis
    inputs: []
    outputs:
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.csv
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.md
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.pdf
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.png
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.svg
    depends_on: []
    approval_slot: null

  - id: clusters_icm
    tex: fig:clusters_icm
    manuscript: true
    clone_ok: true
    repro_output: figures/clusters_icm.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - -m
        - foregrounds.visualization.systems_figures
        - --results-dir
        - scattering/results/legacy-summary
        - --census-data-dir
        - foregrounds/census/data
        - --out-dir
        - ../figures
      cwd: analysis
    inputs:
      - analysis/scattering/results/legacy-summary/sightline_dm_scattering_budget.csv
    outputs:
      - figures/clusters_icm.pdf
    depends_on:
      - sightline_budget
    approval_slot: null

  - id: assoc_cards_grid
    tex: fig:assoc-cards-grid
    manuscript: true
    clone_ok: true
    repro_output: figures/association_cards/association_card_*.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - .
        - --frozen
        - python
        - associations/studies/crossmatching/plot_association_cards.py
        - --manuscript-dir
        - ../figures/association_cards
      cwd: analysis
    inputs: []
    outputs:
      - figures/association_cards/association_card_*.pdf
    depends_on: []
    approval_slot: null

  - id: toa_offset_decomposition
    tex: fig:toa-offset-decomposition
    manuscript: true
    clone_ok: true
    repro_output: figures/toa_offset_decomposition.pdf
    producer:
      argv:
        - uv
        - run
        - --project
        - analysis
        - --frozen
