  - id: fig1_gallery
    tex: fig:codetection-data-grid
    manuscript: true
    clone_ok: false
    repro_output: figures/codetection_data_grid.pdf
    notes: >-
      Needs separate ~/Data/Faber2026/chimefrb/CHIME_bursts and
      ~/Data/Faber2026/dsa110/DSA_bursts waterfalls. Writes staging tree only;
      promote via figure_review (never silent overwrite of manuscript PDF).
    producer:
      argv:
        - uv
        - run
        - --project
        - analysis
        - --frozen
        - python
        - analysis/scripts/plot_codetection_data_grid.py
        - --out
        - analysis/figure_review/artifacts/staging/fig1_gallery/figures/codetection_data_grid
      cwd: .
    inputs:
      - analysis/dispersion/results/joint-phase/manuscript_dm_catalog.csv
      - analysis/scripts/jointmodel_triptych_manifest.yaml
      - ~/Data/Faber2026/chimefrb/CHIME_bursts
      - ~/Data/Faber2026/dsa110/DSA_bursts
    outputs:
      - analysis/figure_review/artifacts/staging/fig1_gallery/figures/codetection_data_grid.pdf
    manuscript_target: figures/codetection_data_grid.pdf
    candidate_root: analysis/figure_review/artifacts/staging/fig1_gallery
    depends_on: []
    approval_slot: fig1-gallery

  - id: oran_qualified_scint
    tex: null
    manuscript: false
    clone_ok: false
    repro_output: >-
      analysis/scintillation/studies/dsa-lorentzian/results/oran_qualified/figures/oran_dsa_calibrated_measurement.png
    notes: >-
      Pipeline qualification product only — not a dedicated manuscript figure.
      Certified DSA bandwidth evidence lives under oran_qualified/; do not
