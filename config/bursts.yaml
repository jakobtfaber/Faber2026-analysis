# FLITS Burst Catalog
# ====================
# Scientific metadata for all analyzed FRBs in the DSA-110 + CHIME co-detection sample.
#
# DM PROVENANCE (2026-07-13 catalog adoption):
# This file is NOT the DM source of truth. The dm/dm_err values below mirror the
# ratified manuscript DM catalog:
#   Faber2026 analysis/dm-joint-phase-v2/manuscript_dm_catalog.csv
# (adopted 2026-07-13; CHIME phase-coherence measurements are primary for all 12
# bursts: dm = adopted_dm, dm_err = adopted_sigma). Update that catalog first,
# then mirror here.
#
# NOTE: The mjd field is 3-decimal (~86 s resolution) — safe only for epoch
# lookup (which day/observation), never for times of arrival.
#
# NOTE: Pipeline-specific configs (paths, downsampling, sampler settings) are in:
#   - batch_configs/          (flits-batch CLI)
#   - scattering/configs/     (scattering pipeline)
#   - scintillation/configs/  (scintillation pipeline)
#
# SCATTERING ANALYSIS STATUS (2025-12-13):
# - Legacy results (Casey, Freya, Wilhelm) archived in .gemini/LEGACY_SCATTERING_RESULTS.md
# - All 12 bursts will be re-analyzed congruently with integrated DM refinement pipeline
# - Results will be stored in flits_results.db and compared with legacy for validation
# - Scattering fields below are LEGACY values, will be updated after re-analysis

