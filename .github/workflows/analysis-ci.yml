name: Analysis continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: analysis-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-analysis-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full-suite: ${{ steps.route.outputs.full-suite }}
      registry-only: ${{ steps.route.outputs.registry-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "full-suite=true" >> "$GITHUB_OUTPUT"
            echo "registry-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$HEAD_SHA^"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          registry_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            registry_only=false
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              RESULTS.md|docs/rse/control/results-registry.toml|docs/rse/control/results-registry-claim-owners.toml) ;;
              *) registry_only=false ;;
            esac
          done
          echo "registry-only=$registry_only" >> "$GITHUB_OUTPUT"
          if [ "$registry_only" = true ]; then
            echo "full-suite=false" >> "$GITHUB_OUTPUT"
          else
            echo "full-suite=true" >> "$GITHUB_OUTPUT"
          fi

  registry-validation:
    name: registry-validation
    needs: changes
    if: needs.changes.outputs.registry-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv run --group test --frozen python -m pytest -q \
            --standalone-analysis tests/test_results_registry.py
          python scripts/render_results_registry.py --check

  analysis-tests:
    name: analysis-tests
    needs: changes
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            --ignore=tests/test_permanent_dualband_workflow.py \
            --ignore=tests/test_checkout_inventory.py
          bash tests/test_journal_append.sh

  dualband-workflow-tests:
    name: dualband-workflow-tests
    needs: [changes, dualband-aggregate]
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dualband-aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-published
      - run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            tests/test_permanent_dualband_workflow.py
        env:
          FABER2026_DUALBAND_PUBLISHED_FIXTURE: ${{ runner.temp }}/dualband-published

  checkout-inventory-tests:
    name: checkout-inventory-tests
    needs: changes
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            tests/test_checkout_inventory.py

  dualband-fit-cell:
    name: dualband-${{ matrix.association }}-${{ matrix.morphology }}
    needs: changes
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - association: one-to-one
            morphology: gaussian
          - association: one-to-one
            morphology: emg
          - association: wrong-chime-component
            morphology: gaussian
          - association: wrong-chime-component
            morphology: emg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run one serial fit cell
        env:
          CELL_ASSOCIATION: ${{ matrix.association }}
          CELL_MORPHOLOGY: ${{ matrix.morphology }}
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/dualband-env" \
            uv run --frozen --group dualband \
            python scripts/run_dualband_burst_model.py \
            --event synthetic --stage fit-cell \
            --association "$CELL_ASSOCIATION" \
            --morphology "$CELL_MORPHOLOGY" \
            --cells-root "$RUNNER_TEMP/dualband-cells"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualband-cell-${{ matrix.association }}-${{ matrix.morphology }}-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-cells
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

  dualband-aggregate:
    name: dualband-aggregate
    needs: [changes, dualband-fit-cell]
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dualband-cell-*-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-cells
          merge-multiple: true
      - name: Validate and aggregate cells
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/dualband-env" \
            uv run --frozen --group dualband \
            python scripts/run_dualband_burst_model.py \
            --event synthetic --stage aggregate \
            --cells-root "$RUNNER_TEMP/dualband-cells" \
            --output-root "$RUNNER_TEMP/dualband-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualband-aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-results/dualband-burst-models/synthetic
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

  analysis-quality:
    name: analysis-quality
    needs: changes
    if: needs.changes.outputs.full-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: uv run --group test --frozen zizmor --pedantic .github/workflows
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  required:
    name: analysis-ci
    if: always()
    needs:
      - changes
      - registry-validation
      - analysis-tests
      - dualband-workflow-tests
      - checkout-inventory-tests
      - dualband-fit-cell
      - dualband-aggregate
      - analysis-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the routed validation lane
        env:
          CHANGES: ${{ needs.changes.result }}
          FULL_SUITE: ${{ needs.changes.outputs.full-suite }}
          REGISTRY_VALIDATION: ${{ needs.registry-validation.result }}
          ANALYSIS_TESTS: ${{ needs.analysis-tests.result }}
          DUALBAND_WORKFLOW: ${{ needs.dualband-workflow-tests.result }}
          CHECKOUT_INVENTORY: ${{ needs.checkout-inventory-tests.result }}
          DUALBAND_FIT: ${{ needs.dualband-fit-cell.result }}
          DUALBAND_AGGREGATE: ${{ needs.dualband-aggregate.result }}
          ANALYSIS_QUALITY: ${{ needs.analysis-quality.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$FULL_SUITE" = true ]; then
            test "$REGISTRY_VALIDATION" = skipped
            test "$ANALYSIS_TESTS" = success
            test "$DUALBAND_WORKFLOW" = success
            test "$CHECKOUT_INVENTORY" = success
            test "$DUALBAND_FIT" = success
            test "$DUALBAND_AGGREGATE" = success
            test "$ANALYSIS_QUALITY" = success
          else
            test "$REGISTRY_VALIDATION" = success
            test "$ANALYSIS_TESTS" = skipped
            test "$DUALBAND_WORKFLOW" = skipped
            test "$CHECKOUT_INVENTORY" = skipped
            test "$DUALBAND_FIT" = skipped
            test "$DUALBAND_AGGREGATE" = skipped
            test "$ANALYSIS_QUALITY" = skipped
          fi
