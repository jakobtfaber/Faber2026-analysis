name: Analysis continuous integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: analysis-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: route-analysis-suite
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "lane=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$HEAD_SHA^"
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          lane=$(python3 scripts/classify_ci_changes.py "${changed[@]}")
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

  registry-validation:
    name: registry-validation
    needs: changes
    if: needs.changes.outputs.lane == 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv run --group test --frozen python -m pytest -q \
            --standalone-analysis tests/test_results_registry.py
          python scripts/render_results_registry.py --check

  analysis-tests:
    name: analysis-tests
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            --ignore=tests/test_permanent_dualband_workflow.py \
            --ignore=tests/test_checkout_inventory.py
          bash tests/test_journal_append.sh

  checkout-inventory-tests:
    name: checkout-inventory-tests
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            tests/test_checkout_inventory.py

  dualband-fit-cell:
    name: dualband-${{ matrix.association }}-${{ matrix.morphology }}
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - association: one-to-one
            morphology: gaussian
          - association: one-to-one
            morphology: emg
          - association: wrong-chime-component
            morphology: gaussian
          - association: wrong-chime-component
            morphology: emg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run one serial fit cell
        env:
          CELL_ASSOCIATION: ${{ matrix.association }}
          CELL_MORPHOLOGY: ${{ matrix.morphology }}
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/dualband-env" \
            uv run --frozen --group dualband \
            python scripts/run_dualband_burst_model.py \
            --event synthetic --stage fit-cell \
            --association "$CELL_ASSOCIATION" \
            --morphology "$CELL_MORPHOLOGY" \
            --cells-root "$RUNNER_TEMP/dualband-cells"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualband-cell-${{ matrix.association }}-${{ matrix.morphology }}-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-cells
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

  dualband-aggregate:
    name: dualband-aggregate
    needs: [changes, dualband-fit-cell]
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dualband-cell-*-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-cells
          merge-multiple: true
      - name: Validate and aggregate cells
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/dualband-env" \
            uv run --frozen --group dualband \
            python scripts/run_dualband_burst_model.py \
            --event synthetic --stage aggregate \
            --cells-root "$RUNNER_TEMP/dualband-cells" \
            --output-root "$RUNNER_TEMP/dualband-results"
      - name: Validate the published workflow fixture
        env:
          FABER2026_DUALBAND_PUBLISHED_FIXTURE: ${{ runner.temp }}/dualband-results/dualband-burst-models/synthetic
        run: |
          PYTHONPATH="$PWD:$PWD/scripts" \
            uv run --group test --frozen python -m pytest -q \
            --standalone-analysis \
            -m "not slow and not network and not external_data and not historical_replay and not integration" \
            tests/test_permanent_dualband_workflow.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualband-aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/dualband-results/dualband-burst-models/synthetic
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

  analysis-quality:
    name: analysis-quality
    needs: changes
    if: needs.changes.outputs.lane != 'registry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          make lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: uv run --group test --frozen zizmor --pedantic .github/workflows
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  required:
    name: analysis-ci
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - changes
      - registry-validation
      - analysis-tests
      - checkout-inventory-tests
      - dualband-fit-cell
      - dualband-aggregate
      - analysis-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the routed validation lane
        env:
          CHANGES: ${{ needs.changes.result }}
          LANE: ${{ needs.changes.outputs.lane }}
          REGISTRY_VALIDATION: ${{ needs.registry-validation.result }}
          ANALYSIS_TESTS: ${{ needs.analysis-tests.result }}
          CHECKOUT_INVENTORY: ${{ needs.checkout-inventory-tests.result }}
          DUALBAND_FIT: ${{ needs.dualband-fit-cell.result }}
          DUALBAND_AGGREGATE: ${{ needs.dualband-aggregate.result }}
          ANALYSIS_QUALITY: ${{ needs.analysis-quality.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$LANE" = full ]; then
            test "$REGISTRY_VALIDATION" = skipped
            test "$ANALYSIS_TESTS" = success
            test "$CHECKOUT_INVENTORY" = success
            test "$DUALBAND_FIT" = success
            test "$DUALBAND_AGGREGATE" = success
            test "$ANALYSIS_QUALITY" = success
          elif [ "$LANE" = quality ]; then
            test "$REGISTRY_VALIDATION" = skipped
            test "$ANALYSIS_TESTS" = skipped
            test "$CHECKOUT_INVENTORY" = skipped
            test "$DUALBAND_FIT" = skipped
            test "$DUALBAND_AGGREGATE" = skipped
            test "$ANALYSIS_QUALITY" = success
          else
            test "$REGISTRY_VALIDATION" = success
            test "$ANALYSIS_TESTS" = skipped
            test "$CHECKOUT_INVENTORY" = skipped
            test "$DUALBAND_FIT" = skipped
            test "$DUALBAND_AGGREGATE" = skipped
            test "$ANALYSIS_QUALITY" = skipped
          fi
