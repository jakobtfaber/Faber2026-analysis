name: Scheduled science replay

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-science-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scheduled-science-replay:
    name: scheduled-science-replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make test-slow
      - run: make test-replay
      - name: Exercise tests requiring non-repository scientific data
        continue-on-error: true
        run: make test-external
