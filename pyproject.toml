[project]
name = "faber2026-analysis"
version = "0.1.0"
description = "Research control, campaigns, and provenance for Faber2026"
requires-python = ">=3.12"
dependencies = [
  "adjustText>=0.8",
  "astropy>=5.0",
  "astroquery",
  "chainconsumer>=0.34",
  "corner>=2.2",
  "emcee>=3.1",
  "healpy>=1.18",
  "h5py>=3.9",
  "ipywidgets>=7.6",
  "jsonschema>=4.0",
  "lmfit>=1.0",
  "matplotlib>=3.4,<3.11",
  "mocpy>=0.17",
  "mpmath>=1.0.0",
  "mwprop>=0.1.0",
  "numpy>=1.20",
  "pandas>=1.3",
  "pyvo",
  "PyYAML>=5.4",
  "SciencePlots>=2.0",
  "scipy>=1.7",
  "tqdm>=4.62",
]

[dependency-groups]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.15.18",
  "zizmor==1.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = [".", "scripts"]
testpaths = [
  "tests",
  "scattering/studies/joint-refits/test_gate_joint_committed.py",
  "scattering/studies/joint-refits/test_posterior_compare.py",
  "scattering/studies/joint-refits/test_tail_coverage.py",
  "scattering/studies/joint-refits/test_likelihood_equivalence.py",
  "scattering/studies/beta-proof-of-concept/test_compare_routes.py",
  "scattering/studies/beta-proof-of-concept/test_build_verdict.py",
  "observations/studies/chime-scallop-calibration/test_scallop_injections.py",
]
xfail_strict = true
markers = [
  "external_data: requires data that are intentionally not stored in this repository",
  "historical_replay: replays frozen evidence or repository history",
  "integration: marks tests spanning multiple components",
  "network: marks tests requiring live network services",
  "slow: marks tests as slow",
  "unit: marks isolated unit tests",
]

[tool.ruff]
line-length = 100
extend-exclude = [
  ".archive",
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  "*/studies/*",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]
