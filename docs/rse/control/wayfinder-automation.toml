[controller]
repo = "jakobtfaber/Faber2026-analysis"
base_branch = "main"
ticket_glob = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-*.md"
state_dir = "~/.local/state/Faber2026-analysis/wayfinder-controller"
worktree_root = "~/Developer/scratch/worktrees/Faber2026-analysis-wayfinder-auto"
model = "gpt-5.5"
reasoning_effort = "medium"
max_parallel = 4
timeout_seconds = 14400

[[task]]
id = "set-expanded-figure3-gate"
wave = "first"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-04-set-figure-3-gate.md"
branch = "codex/auto-set-expanded-figure3-gate"
mode = "resolve"
execution = "afk"
repo = "jakobtfaber/Faber2026-analysis"
depends_on = ["set-expanded-physics-authority", "repeat-expanded-redshift-verification"]
instructions = "Implement the Figure 3 regeneration gate only after physics authority and repeated redshift verification resolve. Do not promote Figure 3."

[[task]]
id = "set-expanded-independent-validation"
wave = "first"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-05-set-independent-validation-gate.md"
branch = "codex/auto-set-expanded-independent-validation"
mode = "resolve"
execution = "afk"
repo = "jakobtfaber/Faber2026-analysis"
depends_on = ["set-expanded-figure3-gate"]
instructions = "Implement the independent-validation gate after the Figure 3 gate resolves. Do not self-certify or promote scientific trust."

[[task]]
id = "repeat-expanded-redshift-verification"
wave = "first"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-09-repeat-redshift-source-verification.md"
branch = "codex/auto-repeat-expanded-redshift-verification"
mode = "resolve"
execution = "afk"
repo = "jakobtfaber/Faber2026-analysis"
depends_on = ["source-zach-whitney-host-redshifts", "replay-nine-sightline-query-corpus"]
instructions = "Repeat source-level redshift verification after the host sources and independent query replay resolve. Preserve existing verdicts until separately adjudicated."

[[task]]
id = "replay-nine-sightline-query-corpus"
wave = "first"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-16-independently-replay-nine-sightline-query-corpus.md"
branch = "codex/auto-replay-nine-sightline-query-corpus"
mode = "resolve"
execution = "afk"
repo = "jakobtfaber/Faber2026-analysis"
depends_on = ["freeze-anonymous-query-corpus", "freeze-protected-query-evidence"]
instructions = "Independently replay the complete anonymous and protected nine-sightline corpus. Stop on missing evidence or disagreement."

[[task]]
id = "adjudicate-host-redshift-differences"
wave = "first"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-19-adjudicate-host-redshift-differences.md"
branch = "codex/auto-adjudicate-host-redshifts"
mode = "resolve"
execution = "hitl"
repo = "jakobtfaber/Faber2026-analysis"
depends_on = ["repeat-expanded-redshift-verification"]
instructions = "Owner-facing host-redshift adjudication. The controller records it but never spawns it."

[[history]]
id = "fail-close-expanded-catalog"
ticket = "docs/rse/wayfinder/tickets/expanded-foreground-catalog-repair-01-fail-close-validation.md"
execution = "afk"
depends_on = []
status = "resolved"

[[history]]
id = "set-expanded-crossmatch-contract"
