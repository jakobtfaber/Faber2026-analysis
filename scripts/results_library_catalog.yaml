# Faber2026 results-library catalog (data only).
# Consumed by build_results_library_inventory.py and materialize_results_library.py.
schema: faber2026-results-library-catalog/v1

trust_legend:
  live: In active manuscript use
  manuscript-live: In active manuscript use
  owner-approved-bytes: Figure bytes approved; science may still be provisional
  provisional: Best-so-far; not V1-certified
  pending-refits: Fail-closed until α=4 consistency clears
  diagnostic_only: Must not enter screen/α claims
  revoked-2026-07-06: Pre-reset; archival only
  external: Lives on h17 or another named compute/data store, not git
  mixed: Mixed trust within tree; inspect before citing
  partial: Incomplete campaign products
  archive: Archived; not for new claims

# mode:
#   materialize — Phase B: real bytes in library; repo path becomes symlink back
#   link_only   — Phase A: library symlink → repo (Overleaf/git-small/live code couples)

entries:
  # --- scattering ---
  - id: scattering.dm-locked-refit
    domain: scattering
    slot: scattering/dm-locked-refit
    trust: provisional
    repo: parent
    mode: materialize
    result_ids: []
    sources:
      - analysis/campaigns/scattering-dm-locked-2026-07-14/results/fit_summaries
      - analysis/campaigns/scattering-dm-locked-2026-07-14/results/ppc
    destinations:
      analysis/campaigns/scattering-dm-locked-2026-07-14/results/fit_summaries: fit_summaries
      analysis/campaigns/scattering-dm-locked-2026-07-14/results/ppc: ppc
    notes: DM-locked scattering refit campaign (2026-07-14). Bulk fit_summaries/ppc in library; fit_adjudication.csv stays git-tracked for CI.

  - id: scattering.refit-superseded
    domain: scattering
    slot: scattering/refit-superseded
    trust: revoked-2026-07-06
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/scattering-refit-2026-06/_a1_fits
      - analysis/campaigns/scattering-refit-2026-06/joint_json
    notes: 2026-06 scattering refit, superseded at the 2026-07-06 trust reset. Small JSON stays git-tracked for FLITS CI; library link_only for nav.

  - id: scattering.beta-campaign
    domain: scattering
    slot: scattering/beta-campaign
    trust: revoked-2026-07-06
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/beta_campaign/fits
      - analysis/campaigns/beta_campaign/beta_campaign_verdicts.json
    notes: 2026-07 beta (free spectral index) scattering campaign, revoked at the 2026-07-06 trust reset. Small JSON stays git-tracked for FLITS CI; full posteriors under $FLITS_RUNS.

  - id: scattering.jointmodel-latest
    domain: scattering
    slot: scattering/jointmodel/latest
    trust: diagnostic_only
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - env: FABER2026_RESULTS_LIBRARY
        suffix: scattering/jointmodel/latest
    notes: Three current morphology-audit candidates; latest is not fit acceptance or manuscript adoption.

  # --- scintillation ---
  - id: scintillation.dsa-lorentzian-first-pass
    domain: scintillation
    slot: scintillation/dsa-lorentzian-first-pass
    trust: provisional
    repo: parent
    mode: materialize
    result_ids: []
    sources:
      - analysis/campaigns/scintillation-dsa-lorentzian-2026-07-07/results
    notes: DSA Lorentzian ACF first-pass campaign (2026-07-07; demoted to first-pass 2026-07-26, from-raw re-do chartered as scint-redo-01). Library holds full results/; oran_qualified/ stays git-tracked for figure approval CI.

  - id: scintillation.chime
    domain: scintillation
    slot: scintillation/chime-diagnostic
    trust: diagnostic_only
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/chime-scintillation
    notes: Archival mixed experiments/docs predating the finalized objective-window campaign.

  - id: scintillation.window-tuning-first-pass
    domain: scintillation
    slot: scintillation/window-tuning-first-pass
    trust: mixed
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/window-tuning-campaign-2026-07-17/results
    notes: "Objective-window ACF tuning campaign (2026-07-17; demoted to first-pass 2026-07-26). PR #192 closed the 24-product campaign; chromatica_hi is a measurement and the other 23 records remain diagnostic only. The compact result tree is git-tracked."

  # --- dispersion ---
  - id: dispersion.dm-phase
    domain: dispersion
    slot: dispersion/dm-phase
    trust: mixed
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/dispersion/dm-phase
    notes: Phase-coherent DM runs (dm_phase_* run dirs) plus dm_power result JSONs. Split 2026-07-28 from the former dispersion/pipeline-results-root slot (a 2026-07-15 snapshot of FLITS results/; the live repo results/ has since diverged). Smoke runs are diagnostic; dm_power products are campaign outputs — inspect before citing.

  - id: dispersion.dm-budget-sightlines
    domain: dispersion
    slot: dispersion/dm-budget-sightlines
    trust: mixed
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/dispersion/dm-budget-sightlines
    notes: Per-burst foreground-galaxy sightline products (*_galaxies.csv, *_mass_profile.png, *_sightline.png), galaxy_mass_profiles.png, galaxy_sightlines_report.html, dmhost_posterior/, sightline DM/scattering budget summaries, and survey/search coverage tables. Split 2026-07-28 from the former dispersion/pipeline-results-root slot (2026-07-15 FLITS results/ snapshot).

  - id: dispersion.pipeline-results-root
    domain: dispersion
    slot: dispersion/pipeline-results-root
    trust: mixed
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/dispersion/pipeline-results-root
    notes: Residual of the 2026-07-15 FLITS results/ snapshot after the 2026-07-28 split (README.md and joint_fit_summary.md only; the live git-tracked copies remain in FLITS results/). DM-phase runs moved to dispersion/dm-phase; sightline/budget products moved to dispersion/dm-budget-sightlines; figure manifests moved to review-ledger/dispersion-figure-manifests.

  - id: dispersion.dm-joint-phase-v2-parent
    domain: dispersion
    slot: dispersion/dm-joint-phase-v2
    trust: provisional
    repo: parent
    mode: materialize
    result_ids: []
    sources:
      - analysis/dm-joint-phase-v2/results/diagnostics
    destinations:
      analysis/dm-joint-phase-v2/results/diagnostics: diagnostics
    notes: Bulk diagnostics in library; fits.json + validation stay git-tracked for CI.

  - id: dispersion.chime-dm
    domain: dispersion
    slot: dispersion/chime-dm
    trust: mixed
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/chime_dm
    notes: Mixed plot script + products; link-only for now.

  # --- foreground ---
  - id: foreground.tau-consistency-catalog
    domain: foreground
    slot: foreground/tau_consistency_catalog.csv
    trust: pending-refits
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/foregrounds/data/tau_consistency_catalog.csv
    notes: Keep tracked in FLITS (small; code-coupled). Library links for navigation.

  - id: foreground.budget-exports
    domain: foreground
    slot: foreground/tex-exports
    trust: manuscript-live
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/campaigns/exports
    notes: Generated TeX for manuscript — stay in FLITS git.

  - id: foreground.provisional-propagation
    domain: foreground
    slot: foreground/provisional-propagation
    trust: pending-refits
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/provisional_propagation
    notes: Active ledger is screen-readiness only and fails closed pending fixed-index refits.

  - id: archive.outdated-science
    domain: archive
    slot: archive/outdated-science
    trust: archive
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/.archive/outdated-science/2026-07-17
    notes: Exact obsolete science bytes (archived 2026-07-17) retained for re-examination; never a current claim source.

  - id: archive.scintillation-acf-review
    domain: archive
    slot: archive/scintillation-acf-review
    trust: archive
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/archive/scintillation-acf-review
    notes: Scintillation ACF review materials (2026-07-13) predating the objective-window campaign; library-resident bytes, cataloged 2026-07-28.

  - id: historical.pipeline-diagnostics
    domain: historical
    slot: historical/pipeline-diagnostics
    trust: diagnostic_only
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/historical/pipeline-diagnostics
    notes: Pipeline diagnostic captures (2026-07-20); library-resident bytes, cataloged 2026-07-28. Diagnostics only, never claim inputs.

  - id: foreground.v3-energetics
    domain: foreground
    slot: foreground/v3-energetics
    trust: partial
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - analysis/v3_energetics
    notes: Driver script + small outputs stay in parent git (not bulk results).

  # --- manuscript (Overleaf-coupled — never materialize) ---
  - id: manuscript.figures
    domain: manuscript
    slot: manuscript/figures
    trust: owner-approved-bytes
    repo: parent
    mode: link_only
    result_ids:
      - sample.gallery_fig1
    sources:
      - figures
    notes: Final embedded figures. Stay in parent repo for Overleaf.

  - id: manuscript.repro-manifest
    domain: manuscript
    slot: manuscript/repro_manifest.csv
    trust: live
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - repro_manifest.csv
    notes: Producer→artifact ledger.

  # --- review ---
  - id: review.figure-review
    domain: review-ledger
    slot: review-ledger/figure_review
    trust: live
    repo: parent
    mode: link_only
    result_ids: []
    sources:
      - figure_review
    notes: Approval receipts + slots.

  - id: review.dispersion-figure-manifests
    domain: review-ledger
    slot: review-ledger/dispersion-figure-manifests
    trust: archive
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - path: ~/Data/Faber2026/results-library/review-ledger/dispersion-figure-manifests
    notes: figures.manifest.json + figures.review.json from the 2026-07-15 FLITS results/ snapshot, moved here in the 2026-07-28 pipeline-results-root split. Historical copies; the live figure-approval ledger is review-ledger/figure_review.

  # --- compute scratch (external) ---
  - id: compute.flits-runs-default
    domain: compute-scratch
    slot: compute-scratch/FLITS_RUNS
    trust: external
    repo: external
    mode: link_only
    result_ids: []
    sources: []
    external_paths:
      - env: FLITS_RUNS
        default: /central/scratch/jfaber/flits-runs
      - path: ~/Developer/scratch/flits-local-runs
    notes: Joint-fit posteriors / samples; not git. Env FLITS_RUNS overrides default HPC path.
